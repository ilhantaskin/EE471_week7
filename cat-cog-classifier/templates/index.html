<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Kind Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            margin-top: 10px;
            padding: 10px 16px;
        }
        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Cat Kind Classifier</h1>

    <div class="box">
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="image" accept=".jpg,.jpeg,.png">
            <br>
            <button type="submit">Classify</button>
        </form>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        {% if result %}
            <h3>Prediction Result</h3>
            <pre>{{ result }}</pre>
        {% endif %}
    </div>
</body>
</html>
